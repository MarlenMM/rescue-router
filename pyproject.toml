[project]
name = "rescue-router"
version = "0.2.0"
description = "Few-shot flood mapping (Chameleon, 50 labelled photos) and truck/boat/foot rescue routing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# CPU environment for everything in src/ except the GPU scripts (finetune, predict, infer_sweep, select_ckpt, probe)
# and the Gradio --live path; those run on Kaggle/Colab, see requirements-gpu.txt. Same pins as requirements.txt.
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-image==0.26.0",
    "matplotlib==3.11.2",
    "pillow==12.3.0",
    "gradio==6.29.1",
    "gradio_client==2.7.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "segment-anything==1.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["chameleon", "chameleon-main", "tools", "assets", "results", "docs", "app"]

[tool.ruff.lint]
# pyflakes + syntax-level pycodestyle errors; kaggle/ and slides/ are records of what ran and are not linted
select = ["E4", "E7", "E9", "F"]
# house style: short lambdas, `l` for labels, `a; b` pairs on one line
ignore = ["E401", "E702", "E731", "E741"]

# CPU-only torch wheels on Linux (CI); macOS wheels from PyPI are CPU/MPS already
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
